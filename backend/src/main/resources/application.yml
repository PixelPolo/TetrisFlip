spring:
  application:
    name: tetrisflip-backend
  mongodb:
    # Credentials come from the environment, never from the repository.
    uri: ${MONGODB_URI:mongodb://localhost:27017/tetrisflip}
  data:
    mongodb:
      auto-index-creation: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    # Its default message echoes the rejected value: keep user input out of the logs.
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
