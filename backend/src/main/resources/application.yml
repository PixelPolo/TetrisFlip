spring:
  application:
    name: tetrisflip-backend
  mongodb:
    # Credentials come from the environment, never from the repository.
    uri: ${MONGODB_URI:mongodb://localhost:27017/tetrisflip}
  data:
    mongodb:
      auto-index-creation: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  # nginx is the only client of this port: trust its X-Forwarded-* headers for the client address and scheme.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 12h
      cookie:
        name: TF_SESSION
        http-only: true
        same-site: lax
        # Cookies are only sent over HTTPS. Browsers still accept them on http://localhost for development.
        secure: ${SESSION_COOKIE_SECURE:true}
      tracking-modes: cookie
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    # Its default message echoes the rejected value: keep user input out of the logs.
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
